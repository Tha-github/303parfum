<!-- Meta tags de SEO e compartilhamento (região "seo" do index.html). Dados: config/site.mjs -->
    <meta name="description" content="{{site.description}}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="{{site.url}}/" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Compartilhamento (WhatsApp, Instagram, Facebook, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{site.locale}}" />
    <meta property="og:site_name" content="{{site.name}}" />
    <meta property="og:title" content="303 Parfum — Alta perfumaria. Preço justo." />
    <meta property="og:description" content="{{site.description}}" />
    <meta property="og:url" content="{{site.url}}/" />
    <meta property="og:image" content="{{site.url}}/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="303 Parfum — Alta perfumaria. Preço justo." />
    <meta name="twitter:card" content="summary_large_image" />
